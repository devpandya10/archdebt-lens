[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "archdebt-lens"
version = "1.0.0"
description = "Automated Architectural Technical Debt Lifecycle and Dependency Platform"
readme = "ATD_Software_Solution_Blueprint.md"
authors = [
    { name = "Dev Pandya", email = "M26CSE003" },
    { name = "Ayush Pundir", email = "M26CSE001" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "networkx>=3.0",
    "scipy>=1.10",
    "numpy>=1.24",
    "GitPython>=3.1",
    "typer>=0.9",
    "rich>=13.0"
]

[project.scripts]
atd-lens = "archdebt_lens.cli.main:app"
